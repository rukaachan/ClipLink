[project]
name = "cliplink"
version = "2.0.0"
description = "Windows clipboard bridge for cross-app image prompt workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
cliplink = "cliplink.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
